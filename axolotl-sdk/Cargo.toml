[package]
name = "axolotl-sdk"
version = "0.1.0"
edition = "2024"

[features]
default = ["minecraft"]
full = ["minecraft", "forge", "fabric", "neoforge", "quilt"]
minecraft = ["piston", "mojang"]
mojang = []
piston = []
forge = []
fabric = []
neoforge = []
quilt = []

[dependencies]
reqwest = {
    version = "0.13",
    features = ["json", "stream"]
}

thiserror = "2.0"

serde = {
    version = "1.0",
    features = ["derive"]
}

serde_json = "1.0"

tokio = {
    version = "1.53",
    features = ["full"]
}

chrono = { version = "0.4", features = ["serde"] }

url = { version = "2.5", features = ["serde"] }

base64 = "0.23"

futures-util = "0.3"

sha1 = "0.11"

hex = "0.4"

async-trait = "0.1"
uuid = { version = "1.29", features = ["v3"] }
zip = "9.1"
